# CHECKS — GitHub re-runs the game's checks on every push (BMUZ "Checks", F70, 2026-10-19).
#
# What it does, in plain words:
#   Every time a branch is pushed (or a pull request opens), GitHub borrows a fresh Linux computer, installs the game
#   exactly as package-lock.json says, and runs the same checks Claude runs on the PC:
#     1. npm run check:fast       unit tests, type check + build, lint, golden games, UI kit rules (~1 min on the PC)
#     2. npm run check:framework  the Game Framework's own checks in a real (headless) browser — only if the game has it
#   Green tick on GitHub = everything passed. Red cross = something broke — open the run, the failing step says what.
#   /deliver looks at the latest run and won't merge a branch while it is red (or still running).
#
# Where it lives: copy this file to the game's .github/workflows/checks.yml (new-game setup does this).
# It never deploys anything — the live site has its own workflow (deploy.yml). This one only looks.
#
# Good to know: GitHub's computer is about 2.5x slower than the PC, so a check that takes 1 min here takes ~2.5 min there.
# If a check only fails on GitHub, look for the real reason (a missing setting, a PC-only path, a race the slower
# computer exposes) — don't just make timeouts longer.

name: Checks

on:
  push:            # every branch
  pull_request:
  workflow_dispatch: # a "Run workflow" button on the Actions tab

permissions:
  contents: read

# One run per branch at a time: a newer push cancels the older run (its result would be out of date anyway).
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: check:fast + check:framework
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (exactly what package-lock.json says)
        run: npm ci

      - name: check:fast
        run: npm run check:fast

      # Does this game have the framework checks? (older games may not yet)
      - name: Look for check:framework
        id: framework
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['check:framework'] ? 0 : 1)"; then
            echo "has=yes" >> "$GITHUB_OUTPUT"
          else
            echo "has=no" >> "$GITHUB_OUTPUT"
            echo "No check:framework script in package.json - skipping the browser checks."
          fi

      # The framework checks drive Playwright's own Chromium (headless, software graphics). Games install either
      # "playwright" or the smaller "playwright-core" — use whichever this game has. --with-deps adds the Linux libraries.
      # Kept between runs (framework v0.32.0, F158 — Keep test browsers on GitHub): the slow part is the Linux packages
      # from Ubuntu's mirror (13 MB took 8 min 19 s; the framework's saves job timed out at 15 min twice in a day), so
      # the browser AND those package files (.deb) are cached, keyed on the Playwright version; a stalled download gives
      # up after 30 s and tries again. apt re-checks every kept file against Ubuntu's signed lists before installing it.
      - name: Which Playwright
        if: steps.framework.outputs.has == 'yes'
        id: playwright
        run: |
          echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
          if [ -e node_modules/.bin/playwright ]; then echo "cli=playwright" >> "$GITHUB_OUTPUT"; else echo "cli=playwright-core" >> "$GITHUB_OUTPUT"; fi

      - name: Browsers kept from an earlier run
        if: steps.framework.outputs.has == 'yes'
        id: browsers
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/apt-cache
          key: test-browsers-${{ runner.os }}-pw${{ steps.playwright.outputs.version }}-chromium

      - name: Install Playwright's Chromium
        if: steps.framework.outputs.has == 'yes'
        timeout-minutes: 15
        env:
          CLI: ${{ steps.playwright.outputs.cli }}
        run: |
          printf '%s\n' 'APT::Keep-Downloaded-Packages "true";' 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/99-test-browsers > /dev/null
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          mkdir -p ~/apt-cache
          if ls ~/apt-cache/*.deb > /dev/null 2>&1; then sudo cp ~/apt-cache/*.deb /var/cache/apt/archives/; fi
          npx "$CLI" install --with-deps chromium
          cp /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true

      - name: Keep the browsers for the next run
        if: steps.framework.outputs.has == 'yes' && steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/apt-cache
          key: ${{ steps.browsers.outputs.cache-primary-key }}

      - name: check:framework
        if: steps.framework.outputs.has == 'yes'
        run: npm run check:framework

      # When something fails, keep the reports so they can be opened from the run page (Summary → Artifacts).
      - name: Keep the reports (only when something failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            e2e-shots/checks.html
            e2e-shots/logs/
            e2e-shots/framework.json
          if-no-files-found: ignore
          retention-days: 14
